# Metrics-only Dynatrace exporter. Drop-in snippet for an existing router.yaml.
telemetry:
  exporters:
    metrics:
      otlp:
        enabled: true
        protocol: http          # gRPC unsupported by Dynatrace
        temporality: delta      # REQUIRED — cumulative is dropped
        endpoint: ${env.DYNATRACE_ENV_URL}/api/v2/otlp/v1/metrics
        http:
          headers:
            Authorization: "Api-Token ${env.DYNATRACE_API_TOKEN}"
