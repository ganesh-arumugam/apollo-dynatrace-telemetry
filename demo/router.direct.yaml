# Demo router config — DIRECT to Dynatrace (no collector).
#
# This is templates/dynatrace.router.yaml + spans.router.yaml +
# instruments.router.yaml merged into one runnable file, plus the local listen
# ports the demo uses, plus a `request_context` selector worked example
# (demo/rhai/main.rhai sets tenant_id, `router.attributes.tenant.id` and the
# `context.check` event both read it back). Nothing else: no Jaeger, no
# Prometheus, no extras.
#
# Custom span/event attributes are a licensed GraphOS Router feature
# ("Advanced telemetry") — https://apollographql.com/docs/graphos/routing/graphos-features.
# Without APOLLO_KEY + APOLLO_GRAPH_REF on a plan that includes it, the
# router refuses to start the moment any spans.<service>.attributes or
# events.<service>.<name> block is present. Live-verified: fails closed on
# router v2.0.0 unlicensed, runs clean on v2.17.0 licensed.
#
# Validate:  python3 scripts/validate_dynatrace.py demo/router.direct.yaml
# Run:       ./demo/up.sh direct
#
# Env: DYNATRACE_ENV_URL (with :443), DYNATRACE_API_TOKEN, DEPLOY_ENV

rhai:
  scripts: ./demo/rhai
  main: main.rhai

# Coprocessor worked example (demo/coprocessor.py): a `RouterRequest`-stage
# call that sets context key `coprocessor_tag`, read back below via
# `spans.router.attributes.coprocessor.tag`. Side-by-side with the Rhai
# `tenant_id` example (demo/rhai/main.rhai) — same stage, same rule about
# request_context vs response_context, different mechanism.
coprocessor:
  url: http://127.0.0.1:8082
  timeout: 2s
  router:
    request:
      headers: false
      body: false
      # `all`, not `true` (legacy v1-name alias) — see templates/spans.router.yaml
      # for why this repo prefers the current context config shape.
      context: all

supergraph:
  listen: 127.0.0.1:4000
  # sandbox (below) refuses to start unless introspection is on.
  introspection: true
health_check:
  listen: 127.0.0.1:8088
homepage:
  enabled: false
sandbox:
  enabled: true
include_subgraph_errors:
  all: true

telemetry:
  exporters:
    metrics:
      common:
        service_name: apollo-router
        resource:
          service.namespace: ${env.APOLLO_SERVICE_NAMESPACE:-supergraph}
          deployment.environment: ${env.DEPLOY_ENV:-demo}
      otlp:
        enabled: true
        protocol: http              # Dynatrace has no gRPC ingest
        temporality: delta          # REQUIRED - cumulative is silently dropped
        endpoint: ${env.DYNATRACE_ENV_URL}/api/v2/otlp/v1/metrics
        http:
          headers:
            Authorization: "Api-Token ${env.DYNATRACE_API_TOKEN}"
        batch_processor:
          # 5s in production. 2s here so a demo run doesn't feel broken while
          # you wait for the first export.
          scheduled_delay: 2s
          max_export_batch_size: 512
          max_concurrent_exports: 1
          max_export_timeout: 30s
          max_queue_size: 2048

    tracing:
      common:
        service_name: apollo-router
        # 1.0 is a demo choice: you want to find *your* request in Dynatrace.
        # Drop to 0.01-0.1 in production or you will be rate limited.
        sampler: 1.0
        parent_based_sampler: true
        resource:
          service.namespace: ${env.APOLLO_SERVICE_NAMESPACE:-supergraph}
          deployment.environment: ${env.DEPLOY_ENV:-demo}
      propagation:
        trace_context: true
      # Returns the trace id on the response so demo/load.sh can print an id you
      # can paste straight into Dynatrace.
      experimental_response_trace_id:
        enabled: true
        header_name: apollo-trace-id
      otlp:
        enabled: true
        protocol: http
        endpoint: ${env.DYNATRACE_ENV_URL}/api/v2/otlp/v1/traces
        http:
          headers:
            Authorization: "Api-Token ${env.DYNATRACE_API_TOKEN}"
        batch_processor:
          scheduled_delay: 2s

    logging:
      stdout:
        enabled: true
        format:
          json:
            display_trace_id: open_telemetry
            display_span_id: true
      # NOTE: the router has no OTLP logging exporter — telemetry.exporters.logging
      # accepts only `common` and `stdout` (verified against router 2.17 config
      # schema). Router logs reach Dynatrace by tailing stdout from a collector
      # (see templates/collector/), not from the router directly.

  instrumentation:
    spans:
      mode: spec_compliant
      default_attribute_requirement_level: required
      router:
        attributes:
          # Set by demo/coprocessor.py during the `RouterRequest` coprocessor
          # call. `response_context`, not `request_context`: at this same
          # `router` scope, request_context reads the pre-hook snapshot, so
          # it would show `default` even though the key is set moments
          # later. See templates/spans.router.yaml for the full rule and the
          # `tenant.id` / Rhai equivalent of this same gotcha.
          coprocessor.tag:
            response_context: coprocessor_tag
            default: unknown
      supergraph:
        attributes:
          # Promotes the context key set by demo/rhai/main.rhai onto a span
          # attribute. `default` distinguishes "selector misconfigured"
          # (attribute missing) from "key never got set" (default shows up).
          tenant.id:
            request_context: tenant_id
            default: unknown
          graphql.operation.name: true
          # GraphQL errors come back with HTTP 200. Without this Dynatrace counts
          # them as successful requests.
          otel.status_code:
            static: ERROR
            condition:
              eq:
                - true
                - on_graphql_error: true
          otel.status_description:
            response_errors: $[0].extensions.code
          error.message:
            response_errors: $[0].message
          graphql.errors:
            on_graphql_error: true
      subgraph:
        attributes:
          subgraph.name: true
          otel.status_code:
            static: ERROR
            condition:
              eq:
                - true
                - subgraph_on_graphql_error: true
          error.message:
            subgraph_response_errors: $[0].message
          graphql.errors:
            subgraph_on_graphql_error: true

    instruments:
      default_requirement_level: required
      router:
        http.server.active_requests: true
        http.server.request.duration: true
        http.server.request.body.size: true
        http.server.response.body.size: true
        apollo.router.overhead: true
        dynatrace.router.requests:
          value: unit
          type: counter
          unit: "{request}"
          description: "Router HTTP requests, by response status code"
          attributes:
            http.response.status_code: true
        dynatrace.router.server.errors:
          value: unit
          type: counter
          unit: "{error}"
          description: "Router responses with a 5xx status"
          # `gte` is not a router condition operator (valid: eq, gt, lt, exists,
          # all, any, not). >= 500 is expressed as > 499.
          condition:
            gt:
              - response_status: code
              - 499
      supergraph:
        dynatrace.graphql.operations:
          value: unit
          type: counter
          unit: "{operation}"
          description: "GraphQL operations executed, by operation type"
          attributes:
            graphql.operation.type: true
      subgraph:
        http.client.request.duration:
          attributes:
            subgraph.name: true
        dynatrace.subgraph.errors:
          value: unit
          type: counter
          unit: "{error}"
          description: "Subgraph responses that carried GraphQL errors"
          condition:
            eq:
              - true
              - subgraph_on_graphql_error: true
          attributes:
            subgraph.name: true

    events:
      router:
        request: info
        response: "off"
        error: error
        # Verification aid for the coprocessor.tag example above: prints the
        # resolved attribute straight to stdout instead of requiring an OTLP
        # trace to be decoded to see it. Same pattern as supergraph's
        # context.check below, for the coprocessor case instead of Rhai.
        coprocessor.check:
          message: "coprocessor context selector check"
          level: info
          on: response
          attributes:
            coprocessor.tag:
              response_context: coprocessor_tag
              default: unknown
      supergraph:
        # Verification aid for the request_context example above: prints the
        # resolved attribute straight to stdout instead of requiring an OTLP
        # trace to be decoded to see it.
        context.check:
          message: "context selector check"
          level: info
          on: response
          attributes:
            tenant.id:
              request_context: tenant_id
              default: unknown
      subgraph:
        request: info
        response: "off"
        error: error
