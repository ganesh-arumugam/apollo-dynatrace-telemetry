# Regenerate demo/supergraph.graphql after editing the subgraph schemas:
#   rover supergraph compose --config demo/supergraph.yaml > demo/supergraph.graphql
# The committed supergraph.graphql lets the demo run without rover installed.
federation_version: =2.9.3
subgraphs:
  products:
    routing_url: http://127.0.0.1:4011/
    schema:
      file: ./subgraph-schemas/products.graphql
  orders:
    routing_url: http://127.0.0.1:4012/
    schema:
      file: ./subgraph-schemas/orders.graphql
