telemetry:
  exporters:
    tracing:
      common:
        sampler: 0.05
      otlp:
        enabled: true
        protocol: http
        endpoint: https://abc.live.dynatrace.com:443/api/v2/otlp/v1/traces
        http:
          headers:
            Authorization: "Api-Token ${env.DYNATRACE_API_TOKEN}"
