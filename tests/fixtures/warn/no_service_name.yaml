telemetry:
  exporters:
    metrics:
      common:
        buckets: [0.05, 0.1, 0.25, 0.5, 0.75, 1.0, 1.5, 2.5, 5.0, 10.0, 20.0]
      otlp:
        enabled: true
        protocol: http
        temporality: delta
        endpoint: https://abc.live.dynatrace.com:443/api/v2/otlp/v1/metrics
        http:
          headers:
            Authorization: "Api-Token ${env.DYNATRACE_API_TOKEN}"
