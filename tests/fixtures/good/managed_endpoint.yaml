telemetry:
  exporters:
    metrics:
      otlp:
        enabled: true
        protocol: http
        temporality: delta
        endpoint: https://dynatrace.example.com:443/e/abc12345/api/v2/otlp/v1/metrics
        http:
          headers:
            Authorization: "Api-Token ${env.DYNATRACE_API_TOKEN}"
